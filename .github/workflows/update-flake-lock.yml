name: Update flake lock

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update inputs
        run: nix flake update

      - name: Evaluate flake
        run: nix flake check --no-build

      - name: Open lock update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/weekly-flake-lock
          delete-branch: true
          commit-message: "Update flake inputs"
          title: "Update flake inputs"
          body: |
            Automated weekly flake input update.

            `nix flake check --no-build` passed before this pull request was created.
